name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: covertree
          POSTGRES_PASSWORD: covertree
          POSTGRES_DB: covertree_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U covertree -d covertree_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Same values as .env.example; CI never has a real Weatherstack key (tests use MSW / a stub).
      TEST_DATABASE_URL: postgresql://covertree:covertree@localhost:5433/covertree_test
      DATABASE_URL: postgresql://covertree:covertree@localhost:5433/covertree_test
      WEATHERSTACK_BASE_URL: http://localhost:4999
      WEATHERSTACK_ACCESS_KEY: ci-fake-key
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        if: hashFiles('apps/web/playwright.config.ts') != ''
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm run verify
      - name: Upload Playwright report
        if: failure() && hashFiles('apps/web/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
