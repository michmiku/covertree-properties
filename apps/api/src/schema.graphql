"""
Contract for docs/SPEC.md (S1–S7). Edit this file first; server and client types are generated from it.
"""
scalar DateTime

"""
US states, DC and inhabited territories (SPEC Decisions: Allowed states).
"""
enum USState {
  AL
  AK
  AZ
  AR
  CA
  CO
  CT
  DE
  FL
  GA
  HI
  ID
  IL
  IN
  IA
  KS
  KY
  LA
  ME
  MD
  MA
  MI
  MN
  MS
  MO
  MT
  NE
  NV
  NH
  NJ
  NM
  NY
  NC
  ND
  OH
  OK
  OR
  PA
  RI
  SC
  SD
  TN
  TX
  UT
  VT
  VA
  WA
  WV
  WI
  WY
  DC
  PR
  GU
  VI
  AS
  MP
}

enum SortDirection {
  ASC
  DESC
}

"""
S7 — a US property, enriched with Weatherstack data when it was created.
"""
type Property {
  id: ID!
  "Street and number, e.g. `15528 E Golden Eagle Blvd`."
  street: String!
  city: String!
  state: USState!
  "Exactly 5 digits, e.g. `85268`."
  zipCode: String!
  "Weatherstack `current` at creation time (units=f). Never refreshed."
  weatherData: Weather!
  lat: Float!
  long: Float!
  createdAt: DateTime!
}

"""
Weatherstack `current` object (Fahrenheit, mph, inches). Fields S4.4 shows are non-null; the rest
are nullable so an absent optional field does not block creation.
"""
type Weather {
  "Observation time in UTC as reported by Weatherstack, e.g. `10:35 AM`."
  observationTime: String!
  temperature: Float!
  feelsLike: Float!
  weatherCode: Int
  weatherDescriptions: [String!]!
  weatherIcons: [String!]!
  humidity: Int!
  windSpeed: Float!
  windDegree: Int
  windDir: String!
  pressure: Float
  precip: Float
  cloudcover: Int
  uvIndex: Float
  visibility: Float
  isDay: Boolean
}

"""
S3 — all fields optional; provided fields are AND-ed. Omitted, null or blank = no constraint.
"""
input PropertyFilter {
  "Case-insensitive substring; `%` and `_` match literally (S3.2–S3.4)."
  city: String
  "Exact match; must be exactly 5 digits or the query fails with BAD_USER_INPUT (S3.5, S3.6)."
  zipCode: String
  state: USState
}

"""
S2 — ties on createdAt are broken by id in the same direction (S2.3).
"""
input PropertyOrderBy {
  createdAt: SortDirection! = DESC
}

type Query {
  "S1–S3. Defaults to newest first."
  properties(filter: PropertyFilter, orderBy: PropertyOrderBy): [Property!]!
  "S4. Unknown or malformed id returns null."
  property(id: ID!): Property
}

input CreatePropertyInput {
  "Trimmed, 1–200 chars."
  street: String!
  "Trimmed, 1–100 chars."
  city: String!
  state: USState!
  "Exactly 5 digits."
  zipCode: String!
}

type CreatePropertySuccess {
  property: Property!
}

type FieldError {
  "Input field name, e.g. `zipCode`."
  field: String!
  message: String!
}

"S5.3 — every invalid field is listed."
type InvalidInputError {
  message: String!
  fieldErrors: [FieldError!]!
}

"S5.4 — same street, city, state and zipCode after trimming (case-sensitive)."
type DuplicatePropertyError {
  message: String!
  existingPropertyId: ID!
}

enum WeatherFailureReason {
  "Connection refused, DNS failure, reset."
  NETWORK
  "No response within 5 s."
  TIMEOUT
  "Non-2xx status."
  HTTP_ERROR
  "HTTP 200 with `{ success: false, error }`."
  UPSTREAM_ERROR
  "Body failed schema validation, incl. unparsable or out-of-range lat/lon."
  INVALID_RESPONSE
  "Resolved country is not the USA (S5.6)."
  LOCATION_MISMATCH
}

"S5.5 — nothing was persisted."
type WeatherUnavailableError {
  message: String!
  reason: WeatherFailureReason!
}

union CreatePropertyResult =
  | CreatePropertySuccess
  | InvalidInputError
  | DuplicatePropertyError
  | WeatherUnavailableError

type DeletePropertySuccess {
  id: ID!
}

"S6.2 — unknown or malformed id."
type PropertyNotFoundError {
  message: String!
  id: ID!
}

union DeletePropertyResult = DeletePropertySuccess | PropertyNotFoundError

type Mutation {
  "S5. The only operation that calls Weatherstack."
  createProperty(input: CreatePropertyInput!): CreatePropertyResult!
  "S6."
  deleteProperty(id: ID!): DeletePropertyResult!
}
